<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RSS агрегатор" />
    <title>RSS агрегатор</title>
  </head>
  <body>
    <div id="root">
      <div class="container mt-5">
        <div class="jumbotron card card-image">
          <h1 class="card-title h1">RSS агрегатор</h1>
          <p class="font-weight-bold">Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form class="form-inline rss-form">
            <div class="input-group w-50">
              <input type="text" name="url" class="form-control" id="urlInput" placeholder="Ссылка RSS" />
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary" disabled>Добавить</button>
            </div>
          </form>
          <div class="feedback invisible"></div>
        </div>
        <div class="row">
          <div class="col rss-channel"></div>
          <div class="col rss-items"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
